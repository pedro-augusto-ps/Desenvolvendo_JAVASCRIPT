<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando DOM</title>
</head>
<body>
    <h1>Somando valores</h1>
    <input type="number" name="n1" id="id_n1"> +
    <input type="number" name="n2" id="id_n2">
    <input type="button" value="Somar" onclick="somar()">
    <div id="resultado">
        Resultado
    </div>
    <script>

        var n1 = window.document.getElementById("id_n1");
        var n2 = window.document.getElementById("id_n2");
        var resultado = window.document.querySelector("div#resultado");

        function somar() {
            var soma = Number(n1.value) + Number(n2.value);
            resultado.innerHTML = `A soma entre ${n1.value} e ${n2.value} é igual a: ${soma}`;
            }
    </script>
</body>
</html>
