<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
    <style>

        :root {
            --fundo-cabecalho: #4E4F3D;
            --fundo-principal: #99A265;
            --verde-escuro: #3E513B;
            --branco: #EADEDA;

        }
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        body {
            display: flex; /*Novo método para fazer o main ocupar a altura toda*/
            flex-direction: column;
            min-height: 100vh;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        header,footer {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40px;
            background-color: var(--fundo-cabecalho);
        }

        h1 {
            color: white;
            text-transform: uppercase;
        }

        main {
            display: grid;
            flex: 1; /*Com o body flex, usar flex:1 aqui faz o main crescer e ocupar tudo entre footer e header*/
            grid-template-columns: 5px 1fr 5px;
            background-color: white;
        }

        section {
            grid-column: 2; /*Filho do main*/
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 5px 0px;
            background-color: var(--fundo-principal);
        }
        
        .cartao {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
            width: 100%;
            max-width: 350px;
            height: 100%;
            max-height: 400px;
            padding: 20px;
            border-radius: 8px;
            background-color: white;
        }

        #container-num {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #container-num label {
            background-color: var(--verde-escuro);
            padding: 20px;
            color: white;
            text-align: center;
            border-radius: 8px;
        }

        #container-num input[type="number"] {
            padding: 5px;
            margin: 20px 0px;
            width: 100%;
            border: 1px solid var(--verde-escuro);
        }
        
        .cartao input[type="button"] {
            padding: 5px;
            width: 100%;
            margin-top: 20px;
            background-color: var(--verde-escuro);
            color: var(--branco);
            text-transform: uppercase;
            border: 1px solid black;
            border-radius: 5px;
            transition: transform 0.3s ease, font-size 0.4s ease, border-left 0.3s ease;
        }

        .cartao input[type="button"]:hover {
            transform: scale(1.1);
            font-size: 1em;
        }

        select {
            padding: 10px;
        }

        select option {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 1.0em;
        }

        footer {
            color: white;
        }

    </style>
</head>
<body>
    <header>
        <h1>Tabuada</h1>
    </header>

    <main>
        <section>
            <div class="cartao">
                <div id="container-num">
                    <label for="idnum_tabuada">Insira o número para ver a tabuada</label>
                    <input type="number" name="num_tabuada" id="idnum_tabuada">
                </div>
                <div id="container-select">
                    <select name="select" id="idselect" size="10">
                        <option>Insira um número!</option>
                    </select>
                </div>
                <input type="button" value="Verificar" onclick="VerTabuada()">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;Pedro Augusto</p>
    </footer>

    <script>


        function VerTabuada() {
            const num_fornecido = Number(document.getElementById("idnum_tabuada").value);
            const caixa_select = document.getElementById("idselect");
            
            if (num_fornecido < 0) {
                caixa_select.innerHTML = ''
                let item = document.createElement('option');
                item.text = "Porfavor insira um número válido";
                caixa_select.appendChild(item)
            }

            else {
                let contador = 1;
                caixa_select.innerHTML = '' // Limpa a caixa do select

                while (contador <= 10) {
                    let item = document.createElement('option'); //Select do HTML trabalho com Option, criou uma.
                    item.text = `${contador} x ${num_fornecido} = ${num_fornecido * contador}`; // Multiplico
                    caixa_select.appendChild(item); //Adiciono o filho item
                    contador += 1;
                }
            }
            
        }
    </script>
</body>
</html>
