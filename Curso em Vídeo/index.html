<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendendo JAVASCRIPT</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: whitesmoke;
        }

        h1 {
            background-color: gray;
            text-align: center;
            color: black;
            text-transform: uppercase;
        }

        p {
            text-align: justify;
            text-indent: 10px;
            background-color: black;
            color: white;
            height: 100vh;
        }
    </style>
</head>
<body>
    <h1>Olá MUNDO!</h1>
    <p>Estou aprendendo JAVASCRIPT!</p>
    <script>
        window.alert("ALERTA!")
        window.prompt("Qual seu nome? ")
        window.confirm("Tá correto? ")
    </script>
</body>
</html>
